# Broker local para las campañas de medida del TFM.
#
# Mosquitto 2.0 escucha solo en localhost y rechaza conexiones anonimas si no
# se le indica lo contrario, de modo que el nodo ESP32 no podria conectarse con
# la configuracion por defecto. Este fichero abre el puerto a la red local y
# permite conexion sin credenciales.
#
# Alcance: red local de laboratorio, sin exposicion a Internet. Es el escenario
# que describe docs/ARCHITECTURE.md. No usar con el router reenviando el 1883.
#
#   mosquitto -c server/mosquitto-local.conf -v

listener 1883 0.0.0.0
allow_anonymous true

# Sin persistencia: el logger es quien conserva los datos, no el broker.
persistence false
